# Verificação que o PLANO-V3 exige a cada fase, agora automática:
# tsc limpo + testes + build. Sem segredos: os testes mockam a AnyAPI
# (custo zero) e o build não precisa de Supabase.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
